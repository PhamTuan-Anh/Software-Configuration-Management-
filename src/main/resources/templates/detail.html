<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.name} + ' - TechStore'">Chi tiết sản phẩm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } a { text-decoration: none; } </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- HEADER: Đã đồng bộ thanh Search, Giỏ hàng và Tài khoản -->
    <header class="bg-white border-b px-8 py-4 flex justify-between items-center sticky top-0 z-50 shadow-sm">
        <a th:href="@{/}" class="flex items-center gap-2 cursor-pointer text-decoration-none hover:opacity-80 transition">
            <div class="bg-gray-900 text-white w-10 h-10 rounded-lg flex items-center justify-center font-black text-xl">PC</div>
            <span class="text-2xl font-bold text-gray-900">TechStore</span>
        </a>
        
        <!-- Form Tìm kiếm -->
        <form th:action="@{/shop}" method="get" class="flex-1 max-w-xl mx-10 hidden lg:block">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </span>
                <input type="text" name="keyword" class="block w-full pl-10 pr-3 py-2 border border-gray-200 rounded-xl leading-5 bg-gray-50 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition" placeholder="Tìm kiếm linh kiện... (Nhấn Enter để tìm)">
            </div>
        </form>

        <div class="flex gap-6 items-center">
            <button class="flex items-center gap-1.5 font-bold text-gray-600 hover:text-blue-600 transition">
                <span class="text-blue-600">🤖</span> AI Tư vấn
            </button>
            
            <a th:href="@{/cart}" class="text-gray-400 hover:text-gray-900 transition relative block">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                <span th:if="${cartCount != null and cartCount > 0}" th:text="${cartCount}" class="absolute -top-2 -right-2 bg-red-500 text-white text-[10px] font-bold h-4 w-4 rounded-full flex items-center justify-center">0</span>
            </a>
            
            <div th:if="${username == null}" class="flex items-center gap-4">
                <a th:href="@{/login}" class="font-bold text-gray-700 hover:text-blue-600 text-decoration-none">Đăng nhập</a>
                <a th:href="@{/register}" class="bg-blue-600 text-white px-6 py-2 rounded-full font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-200 text-decoration-none">Đăng ký</a>
            </div>

            <div th:if="${username != null}" class="flex items-center gap-3">
                <span class="font-bold text-blue-600">Chào, [[${username}]]!</span>
                <a th:href="@{/logout}" class="text-xs text-red-400 underline hover:text-red-600 transition">Thoát</a>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-6 py-12">
        <a th:href="@{/}" class="inline-flex items-center gap-2 text-gray-500 hover:text-blue-600 mb-8 font-semibold transition text-decoration-none">
            <span>←</span> Trở về danh sách
        </a>

        <div class="bg-white rounded-[32px] shadow-xl shadow-gray-100 p-8 lg:p-12 border border-gray-50">
            <div class="flex flex-col lg:flex-row gap-12">
                
                <div class="lg:w-1/2 flex items-center justify-center bg-gray-50 rounded-3xl p-8">
                    <img th:src="${product.imageUrl}" alt="Hình sản phẩm" class="w-full max-w-sm object-contain mix-blend-multiply hover:scale-105 transition duration-300">
                </div>

                <div class="lg:w-1/2 flex flex-col justify-center">
                    
                    <div class="flex gap-2 mb-4">
                        <div class="bg-gray-100 text-gray-600 font-bold px-4 py-1.5 rounded-full w-max text-xs uppercase tracking-wider" th:text="${product.category != null ? product.category : 'Linh kiện'}">Danh mục</div>
                        <div class="bg-green-50 text-green-600 font-bold px-4 py-1.5 rounded-full w-max text-xs uppercase tracking-wider">Sẵn hàng</div>
                    </div>
                    
                    <h1 class="text-3xl lg:text-4xl font-black text-gray-900 leading-tight mb-4" th:text="${product.name}">Tên Sản Phẩm</h1>
                    <div class="text-4xl font-black text-blue-600 mb-6" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + 'đ'">0đ</div>
                    
                    <div class="bg-gray-50 rounded-2xl p-5 mb-6 border border-gray-100">
                        <h3 class="font-bold text-gray-900 mb-3 text-sm uppercase tracking-wider border-b border-gray-200 pb-2">Thông số cơ bản</h3>
                        <ul class="text-sm text-gray-700 space-y-3 mt-3">
                            <li class="flex justify-between items-center">
                                <span class="text-gray-500 font-medium">Thương hiệu:</span>
                                <span class="font-bold text-right" th:text="${product.brand != null ? product.brand : 'Đang cập nhật'}">...</span>
                            </li>
                            <li class="flex justify-between items-center">
                                <span class="text-gray-500 font-medium">Bảo hành:</span>
                                <span class="font-bold text-right" th:text="${product.warranty != null ? product.warranty : 'Đang cập nhật'}">...</span>
                            </li>
                            <li class="flex justify-between items-center">
                                <span class="text-gray-500 font-medium">Hiệu năng:</span>
                                <span class="font-bold text-right max-w-[60%]" th:text="${product.specs != null ? product.specs : 'Đang cập nhật'}">...</span>
                            </li>
                            <li class="flex justify-between items-center">
                                <span class="text-gray-500 font-medium">Ngày sản xuất:</span>
                                <span class="font-bold text-right" th:text="${product.manufactureDate != null ? product.manufactureDate : 'Đang cập nhật'}">...</span>
                            </li>
                        </ul>
                    </div>
                    
                    <div class="border-t border-gray-100 pt-6 mb-8">
                        <h3 class="font-bold text-gray-900 mb-3 text-lg">Đặc điểm nổi bật:</h3>
                        <div class="text-gray-500 leading-relaxed text-sm space-y-2" th:utext="${product.description != null ? product.description : 'Đang cập nhật mô tả chi tiết cho sản phẩm này...'}"></div>
                    </div>

                    <a th:href="@{/cart/add/{id}(id=${product.id})}" class="bg-black text-white px-8 py-4 rounded-2xl font-bold hover:scale-105 transition shadow-2xl flex items-center justify-center gap-3 text-lg cursor-pointer text-center text-decoration-none">
                        <span>+</span> Thêm vào giỏ hàng
                    </a>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
