<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - TechStore</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { color: #667eea; font-size: 28px; font-weight: 700; }
        .logo p { color: #888; font-size: 14px; margin-top: 4px; }
        h2 { font-size: 22px; color: #333; margin-bottom: 24px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 14px; color: #555; margin-bottom: 6px; font-weight: 500; }
        input {
            width: 100%; padding: 12px 16px;
            border: 1.5px solid #ddd; border-radius: 8px;
            font-size: 15px; transition: border 0.2s;
            outline: none;
        }
        input:focus { border-color: #667eea; }
        .btn {
            width: 100%; padding: 13px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white; border: none; border-radius: 8px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            margin-top: 8px; transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .alert-error {
            background: #fff0f0; border: 1px solid #ffcdd2;
            color: #c62828; padding: 12px 16px;
            border-radius: 8px; margin-bottom: 18px; font-size: 14px;
        }
        .alert-success {
            background: #f0fff4; border: 1px solid #c8e6c9;
            color: #2e7d32; padding: 12px 16px;
            border-radius: 8px; margin-bottom: 18px; font-size: 14px;
        }
        .footer { text-align: center; margin-top: 24px; font-size: 14px; color: #888; }
        .footer a { color: #667eea; text-decoration: none; font-weight: 600; }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <h1>🛒 TechStore</h1>
        <p>Chào mừng bạn quay trở lại</p>
    </div>

    <h2>Đăng nhập</h2>

    <div th:if="${error}" class="alert-error" th:text="${error}"></div>
    <div th:if="${success}" class="alert-success" th:text="${success}"></div>

    <form method="post" action="/login">
        <div class="form-group">
            <label>Tên đăng nhập</label>
            <input type="text" name="username" placeholder="Nhập tên đăng nhập" required />
        </div>
        <div class="form-group">
            <label>Mật khẩu</label>
            <input type="password" name="password" placeholder="Nhập mật khẩu" required />
        </div>
        <button type="submit" class="btn">Đăng nhập</button>
    </form>

    <div class="footer">
        Chưa có tài khoản? <a href="/register">Đăng ký ngay</a>
    </div>
</div>
</body>
</html>
