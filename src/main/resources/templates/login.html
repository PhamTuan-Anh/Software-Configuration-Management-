<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - TechStore</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .logo { text-align: center; margin-bottom: 25px; }
        .logo h1 { color: #667eea; font-size: 28px; font-weight: 800; }
        .logo p { color: #888; font-size: 14px; }
        
        .back-home {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
            transition: color 0.2s;
        }
        .back-home:hover { color: #667eea; }

        h2 { font-size: 20px; color: #333; margin-bottom: 20px; text-align: center; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; color: #555; margin-bottom: 5px; font-weight: 600; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 12px;
            border: 1.5px solid #eee; border-radius: 8px;
            font-size: 15px; outline: none; transition: 0.3s;
        }
        input:focus { border-color: #667eea; background-color: #f9faff; }

        /* Style cho ô Remember Me */
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0 20px 0;
            font-size: 13px;
        }
        .remember-me { display: flex; align-items: center; cursor: pointer; color: #666; }
        .remember-me input { margin-right: 8px; cursor: pointer; }
        .forgot-pw { color: #667eea; text-decoration: none; font-weight: 600; }

        .btn {
            width: 100%; padding: 13px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white; border: none; border-radius: 8px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 5px 15px rgba(102,126,234,0.4); }

        .footer { text-align: center; margin-top: 25px; font-size: 14px; color: #888; }
        .footer a { color: #667eea; text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>
<div class="card">
    <a th:href="@{/}" class="back-home">
        <svg style="width:16px; height:16px; margin-right:5px" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Quay lại cửa hàng
    </a>

    <div class="logo">
        <h1>🛒 TechStore</h1>
        <p>Hệ thống xây dựng PC cùng AI</p>
    </div>

    <div th:if="${error}" class="alert-error" th:text="${error}" style="color: red; text-align: center; margin-bottom: 10px; font-size: 13px;"></div>

    <form method="post" th:action="@{/login}">
        <div class="form-group">
            <label>Tên đăng nhập</label>
            <input type="text" name="username" placeholder="Nhập username..." required />
        </div>
        <div class="form-group">
            <label>Mật khẩu</label>
            <input type="password" name="password" placeholder="Nhập mật khẩu..." required />
        </div>

        <div class="options">
            <label class="remember-me">
                <input type="checkbox" name="remember"> Ghi nhớ tôi
            </label>
            <a href="#" class="forgot-pw">Quên mật khẩu?</a>
        </div>

        <button type="submit" class="btn">Đăng nhập ngay</button>
    </form>

    <div class="footer">
        Thành viên mới? <a href="/register">Tạo tài khoản</a>
    </div>
</div>
</body>
</html>
