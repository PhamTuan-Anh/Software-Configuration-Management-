<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Xây dựng PC cùng AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">

    <header class="bg-white border-b px-8 py-4 flex justify-between items-center sticky top-0 z-50 shadow-sm">
        <div class="text-2xl font-black text-gray-900">
            PC <span class="text-blue-600">TechStore</span>
        </div>
        
        <div class="flex gap-4 items-center">
            <button class="font-bold text-gray-600 hover:text-blue-600 transition">AI Tư vấn</button>
            <a th:href="@{/login}" class="bg-gray-900 text-white px-6 py-2.5 rounded-xl font-bold hover:bg-gray-800 transition shadow-md">
                Đăng nhập
            </a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-12">
        
        <div class="mb-12 bg-white rounded-3xl p-8 border border-gray-100 shadow-sm flex justify-between items-center">
            <div>
                <h1 class="text-4xl font-black text-gray-900 mb-2">Xây dựng PC <span class="text-blue-600">cùng AI</span></h1>
                <p class="text-gray-500 text-lg">Trợ lý ảo giúp bạn chọn linh kiện phù hợp nhất với ngân sách.</p>
            </div>
            <button class="bg-black text-white px-8 py-4 rounded-2xl font-bold hover:scale-105 transition shadow-lg">
                Chat ngay
            </button>
        </div>

        <h2 class="text-2xl font-bold mb-8 flex items-center gap-2">
            <div class="w-1.5 h-6 bg-blue-600 rounded-full"></div>
            Danh sách Linh kiện
        </h2>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            
            <div th:each="product : ${products}" class="bg-white border border-gray-100 rounded-2xl p-5 hover:shadow-xl transition-all duration-300 group cursor-pointer">
                
                <div class="h-48 bg-gray-50 rounded-xl mb-4 overflow-hidden flex items-center justify-center p-4">
                    <img th:src="${product.imageUrl}" alt="Product Image" class="max-h-full object-contain mix-blend-multiply group-hover:scale-110 transition duration-300" />
                </div>
                
                <h3 class="font-bold text-sm text-gray-900 line-clamp-2 min-h-[40px] mb-2" th:text="${product.name}">
                    Tên sản phẩm mẫu
                </h3>
                
                <div class="mt-auto pt-3 flex items-center justify-between border-t border-dashed border-gray-200">
                    <span class="text-lg font-black text-blue-600" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + 'đ'">
                        0đ
                    </span>
                    
                    <button class="bg-gray-100 text-gray-900 w-10 h-10 rounded-xl hover:bg-black hover:text-white transition flex items-center justify-center font-bold text-xl">
                        +
                    </button>
                </div>
                
            </div>
            </div>
    </main>

</body>
</html>
