<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - TechStore</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            position: relative; /* Quan trọng để ghim mũi tên */
        }
        
        /* Style cho mũi tên Quay lại */
        .back-arrow {
            position: absolute;
            top: 24px;
            left: 24px;
            color: #94a3b8;
            transition: all 0.2s;
        }
        .back-arrow:hover {
            color: #667eea;
            transform: translateX(-4px); /* Nhích nhẹ sang trái khi hover */
        }

        .logo { text-align: center; margin-bottom: 25px; margin-top: 10px; }
        .logo h1 { color: #667eea; font-size: 28px; font-weight: 800; }
        .logo p { color: #888; font-size: 14px; }

        h2 { font-size: 20px; color: #333; margin-bottom: 20px; text-align: center; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; color: #555; margin-bottom: 5px; font-weight: 600; }
        input {
            width: 100%; padding: 12px 16px;
            border: 1.5px solid #eee; border-radius: 8px;
            font-size: 15px; transition: 0.3s;
            outline: none;
        }
        input:focus { border-color: #667eea; background-color: #f9faff; }
        
        .btn {
            width: 100%; padding: 13px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white; border: none; border-radius: 8px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            margin-top: 8px; transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 5px 15px rgba(102,126,234,0.4); }
        
        .alert-error {
            background: #fff0f0; border: 1px solid #ffcdd2;
            color: #c62828; padding: 12px 16px;
            border-radius: 8px; margin-bottom: 18px; font-size: 14px; text-align: center;
        }
        .footer { text-align: center; margin-top: 25px; font-size: 14px; color: #888; }
        .footer a { color: #667eea; text-decoration: none; font-weight: 700; }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="card">
    <a th:href="@{/}" class="back-arrow" title="Quay lại trang chủ">
        <svg style="width:24px; height:24px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
    </a>

    <div class="logo">
        <h1>🛒 TechStore</h1>
        <p>Tạo tài khoản mới</p>
    </div>

    <div th:if="${error}" class="alert-error" th:text="${error}"></div>

    <form method="post" action="/register">
        <div class="form-group">
            <label>Tên đăng nhập</label>
            <input type="text" name="username" placeholder="Nhập tên đăng nhập" required />
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="Nhập email" required />
        </div>
        <div class="form-group">
            <label>Mật khẩu</label>
            <input type="password" name="password" placeholder="Nhập mật khẩu" required />
        </div>
        <div class="form-group">
            <label>Xác nhận mật khẩu</label>
            <input type="password" name="confirmPassword" placeholder="Nhập lại mật khẩu" required />
        </div>
        <button type="submit" class="btn">Tạo tài khoản</button>
    </form>

    <div class="footer">
        Đã có tài khoản? <a href="/login">Đăng nhập</a>
    </div>
</div>
</body>
</html>
